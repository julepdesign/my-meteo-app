<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Syne:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>My Meteo App</title>
  </head>
  <body>
    <div class="meteo-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Enter a city..."
            required
            id="search-form-input"
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>
      <main class="weather-card">
        <div class="current-weather">
          <div class="current-left">
            <h1><span id="temperature"></span>°C</h1>
            <h2 id="city"></h2>

            <div class="date">
              <div id="day"></div>
              <div id="time"></div>
              <div id="year"></div>
            </div>
          </div>

          <div class="current-right">
            <div class="condition">
              <div id="icon-weather"></div>
              <div id="description"></div>
            </div>

            <div class="atmos">
              HUMIDITY // <span id="humidity"></span> <br />
              WIND // <span id="speed"></span> km/h
            </div>
          </div>
        </div>
      </main>
      <div class="forecast-wrapper">
        <div class="weather-forecast" id="forecast"></div>
      </div>

      <footer>
        Designed by
        <a href="https://julepdesign.com" target="_blank">julepdesign.com</a
        ><br />
        Coded with mucho amor 🩷 by
        <a href="https://github.com/julepdesign" target="_blank"> julepdesign</a
        >, available open-sourced on
        <a href="https://github.com/julepdesign/my-meteo-app" target="_blank">
          Github</a
        >
        & hosted on
        <a href="https://my-meteo-app-navy.vercel.app/" target="_blank">
          Vercel</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
